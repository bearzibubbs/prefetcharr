apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefetcharr-dev
  namespace: servarr
  labels:
    app: prefetcharr-dev
    app.kubernetes.io/component: prefetcharr
    app.kubernetes.io/instance: prefetcharr-dev
    app.kubernetes.io/name: prefetcharr
    app.kubernetes.io/part-of: servarr
    app.openshift.io/runtime-namespace: servarr
spec:
  replicas: 0
  selector:
    matchLabels:
      app: prefetcharr-dev
  template:
    metadata:
      labels:
        app: prefetcharr-dev
        deployment: prefetcharr-dev
    spec:
      containers:
        - name: prefetcharr
          image: quay.nekohouse.ca:8443/init/prefetcharr:latest
          imagePullPolicy: Always
          volumeMounts:
            - name: config
              mountPath: /etc/prefetcharr
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: prefetcharr-config
            items:
              - key: config.toml
                path: config.toml
      imagePullSecrets:
        - name: init-servarrbot-pull-secret
